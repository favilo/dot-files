- name: Remove Homebrew Neovim
  community.general.homebrew:
    name: neovim
    state: absent

- name: Ensure local bin directory exists
  file:
    path: "{{ dotfiles_user_home }}/.local/bin"
    state: directory
    mode: "0755"

- name: Link bob Neovim shim
  file:
    src: "{{ dotfiles_user_home }}/Library/Application Support/bob/nvim-bin/nvim"
    dest: "{{ dotfiles_user_home }}/.local/bin/nvim"
    state: link
    force: true
